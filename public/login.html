<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pdrLink - Autenticação</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="shortcut icon" href="icons/favicon/icon.png" type="image/x-icon">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

  <div class="login-wrapper glass-panel">
    <div class="brand-title">pdrLink.</div>

    <div class="tabs">
      <button id="tabLogin" class="ativo">Entrar</button>
      <button id="tabRegistro">Nova Conta</button>
    </div>

    <div id="formLogin">
      <input type="email" id="loginEmail" placeholder="Seu e-mail">
      <input type="password" id="loginSenha" placeholder="Sua senha">
      <button id="btnLogin">Acessar Painel</button>
    </div>

    <div id="formRegistro" style="display:none">
      <input type="text" id="regUsername" placeholder="Seu @usuario">
      <input type="email" id="regEmail" placeholder="E-mail de contato">
      <input type="password" id="regSenha" placeholder="Crie uma senha forte (mín. 8)">
      <select id="regTipo">
        <option value="pessoa">Criador de Conteúdo / Pessoal</option>
        <option value="loja">Marca / Negócio Local</option>
      </select>

      <label class="termos-check">
        <input type="checkbox" id="aceitaTermos">
        <span>
          Li e aceito os <a href="/termos.html" target="_blank">Termos de Uso</a> e a
          <a href="/privacidade.html" target="_blank">Política de Privacidade</a>.
        </span>
      </label>

      <button id="btnRegistro">Criar minha página</button>
    </div>

    <!-- Divisor "ou" -->
    <div style="display: flex; align-items: center; margin: 20px 0;">
      <div style="flex: 1; height: 1px; background: rgba(255, 255, 255, 0.15);"></div>
      <span style="padding: 0 10px; color: #888; font-size: 13px;">ou</span>
      <div style="flex: 1; height: 1px; background: rgba(255, 255, 255, 0.15);"></div>
    </div>

    <!-- Botão Oficial do Google -->
    <div id="googleButtonDiv" style="display: flex; justify-content: center; margin-bottom: 15px;"></div>
    <!-- Aviso Legal de Termos -->
    <p style="font-family: 'Manrope', sans-serif; font-size: 0.8rem; color: var(--text-muted); text-align: center; margin: 0 auto 1.2rem auto; line-height: 1.45; max-width: 310px;">
      Ao continuar, você concorda com os 
      <a href="/termos.html" target="_blank" style="color: var(--navy); font-weight: 700; text-decoration: underline;">Termos de Uso</a> e a 
      <a href="/privacidade.html" target="_blank" style="color: var(--navy); font-weight: 700; text-decoration: underline;">Política de Privacidade</a>.
    </p>
    <!-- NOVA ABA DE VERIFICAÇÃO -->
    <div id="formVerificacao" style="display: none; text-align: center; margin-top: 20px;">
      <h3 style="color: #333;">Verifique seu E-mail</h3>
      <p style="color: #666; font-size: 14px;">Enviamos um código de 6 dígitos para <br><strong id="emailDestino"></strong>.</p>

      <div style="margin: 20px 0;">
        <input type="text" id="codigoVerificacao" placeholder="000000" maxlength="6"
          style="font-size: 24px; text-align: center; letter-spacing: 10px; width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 8px;">
      </div>

      <button type="button" id="btnVerificar"
        style="width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-bottom: 10px;">
        Confirmar Código
      </button>

      <button type="button" id="btnVoltarLogin"
        style="width: 100%; padding: 12px; background-color: transparent; color: #007bff; border: 1px solid #007bff; border-radius: 6px; cursor: pointer; font-size: 16px;">
        Voltar ao Login
      </button>
    </div>

    <p class="erro" id="mensagemErro"></p>
  </div>
  <script src="/js/api.js" defer></script>
  <script src="js/cookie.js" defer></script>
  <script src="/js/login.js" defer></script>
</body>

</html>
